// Pluto Keyboard: the version is set explicitly in gradle.properties (plutoVersionName /
// plutoVersionCode). The VERSION_NAME / VERSION_CODE environment variables still override it.
def getVersionCode = { ->
    def envCode = System.getenv('VERSION_CODE')
    if (envCode?.trim()) {
        try {
            return Integer.parseInt(envCode.trim())
        } catch (NumberFormatException ignored) {
            project.logger.warn("VERSION_CODE='$envCode' is not a valid integer – using plutoVersionCode from gradle.properties.")
        }
    }

    return Integer.parseInt(project.property('plutoVersionCode').toString().trim())
}

def getVersionName = { ->
    def envName = System.getenv('VERSION_NAME')
    if (envName?.trim()) {
        return envName.trim()
    }

    return project.property('plutoVersionName').toString().trim()
}

def getBranch = { ->
    def envName = System.getenv('BRANCH_NAME')
    if (envName?.trim()) {
        return envName.trim()
    } else {
        project.logger.warn("BRANCH_NAME env variable not set – falling back to git branch.")
    }

    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'branch', '--show-current'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (ignored) {
        project.logger.lifecycle("Failed to get branch from git!")
        return "master"
    }
}


// Pluto Keyboard: the translations come from FUTO Keyboard and name it ("FUTO Keyboard",
// "Teclado FUTO", ...). These lists adjust the translated strings that name the app itself:
// - dropped: the translation is removed, so every locale shows the English value (the app names,
//   and strings whose English text now says something different).
// - rebranded: "FUTO" in the translation is replaced with "Pluto".
// - rebrandedFirst: only the first "FUTO" is replaced, and later ones mean FUTO, the original developer
//   (payment text).
final def plutoDroppedTranslations = [
        'english_ime_name', 'spell_checker_service_name', 'english_ime_settings',
        'android_spell_checker_settings', 'crashed_text_email', 'swipe_settings_use_old_swipe_subtitle',
] as Set
final def plutoRebrandedTranslations = [
        'crashed_text', 'setup_welcome_text', 'setup_active_input_method',
        'resource_importer_warning_cfg_backup_newer_version', 'theme_settings_warning_newer_version',
        'action_voice_input_open_settings_button_to_grant_microphone_permission',
] as Set
final def plutoRebrandedFirstTranslations = [
        'payment_screen_sales_paragraph_1', 'payment_screen_sales_paragraph_1_alt',
] as Set
final def futoNamePattern = /FUTO|فوتو/ // "FUTO", and its Arabic transliteration

final def translationsWithoutEngValues = { final String path ->
    final def sourceDir = file(path)
    final def taskNameSuffix = sourceDir.name.capitalize()

    final def destDir = file("$buildDir/generated/res-translations-filtered/${taskNameSuffix}")

    tasks.register("prepareResFilter${taskNameSuffix}", Copy) {
        from(sourceDir) {
            include 'values-*/**'

            // Name of the string whose text continues on the following lines, if any
            String multiLineStringName = null

            filter { String line ->
                // Pluto Keyboard: strings that span several lines are passed through as they are,
                // except that the lists above still apply to them.
                if (multiLineStringName != null) {
                    final String name = multiLineStringName
                    if (line.contains('</string>')) multiLineStringName = null
                    if (plutoDroppedTranslations.contains(name)) return null
                    if (plutoRebrandedTranslations.contains(name)) return line.replaceAll(futoNamePattern, 'Pluto')
                    return line
                }
                def startMatcher = line =~ /<string name="([^"]+)"[^>]*>/
                if (startMatcher.find() && !line.contains('</string>')) {
                    multiLineStringName = startMatcher.group(1)
                    if (plutoDroppedTranslations.contains(multiLineStringName)) return null
                    if (plutoRebrandedTranslations.contains(multiLineStringName)) return line.replaceAll(futoNamePattern, 'Pluto')
                    return line
                }

                def matcher = line =~ /<string name="([^"]+)"[^>]*>(.+)<\/string>/

                if (matcher.find()) {
                    var stringName = matcher.group(1)
                    var content = matcher.group(2)

                    if (plutoDroppedTranslations.contains(stringName)) {
                        return null // Removes the line, so the English value is used
                    }

                    content = content
                    // Fix duplicate string tags
                            .replaceAll(/<!\[CDATA\[<string [^>]+>(.+)<\\/string>\]\]>/, '$1')
                            .replaceAll(/<string [^>]+>(.+)<\\/string>/, '$1')
                            .replaceAll(/&lt;string [^&]+&gt;(.+)&lt;\\/string&gt;/, '$1')
                    // Remove xliff:g tags entirely, keep only the content
                            .replaceAll(/<xliff:g [^>]+>(.+?)<\/xliff:g>/, '$1')
                            .replaceAll(/&lt;xliff:g [^&]+&gt;(.+?)&lt;\/xliff:g&gt;/, '$1')
                    // Fix escaped quotes
                            .replaceAll(/&amp;quot;/, '"')
                            .replaceAll(/&quot;/, '"')
                            .replaceAll(/\\+/, "\\\\")
                            .replaceAll(/\\"/, '"')
                            .replaceAll(/\\'/, "'")

                    if (content.startsWith("&quot;")) {
                        content = content.substring(6)
                    } else if (content.startsWith('\\"')) {
                        content = content.substring(2)
                    } else if (content.startsWith('"')) {
                        content = content.substring(1)
                    }
                    if (content.endsWith("&quot;")) {
                        content = content.substring(0, content.length() - 6)
                    } else if (content.endsWith('\\"')) {
                        content = content.substring(0, content.length() - 2)
                    } else if (content.endsWith('"')) {
                        content = content.substring(0, content.length() - 1)
                    }

                    content = content.replaceAll('"', '\\\\"')

                    if (plutoRebrandedTranslations.contains(stringName)) {
                        content = content.replaceAll(futoNamePattern, 'Pluto')
                    } else if (plutoRebrandedFirstTranslations.contains(stringName)) {
                        content = content.replaceFirst(futoNamePattern, 'Pluto')
                    }

                    "    <string name=\"" + stringName + "\">\"" + content + "\"</string>\n"
                } else {
                    line
                }
            }
        }
        into(destDir)
        includeEmptyDirs = false

        doFirst {
            if (destDir.exists()) {
                println "Cleaning old contents of $destDir"
                destDir.deleteDir()
            }
        }
    }

    // Ensure it runs before build
    preBuild.dependsOn("prepareResFilter${taskNameSuffix}")

    destDir
}

tasks.register('updateLocales', Exec) {
    workingDir = file('tools/make-keyboard-text-py')
    environment 'PYTHONUTF8', '1'
    commandLine = [
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3",
            "src/generate.py"
    ]
}

tasks.register('updateBundleResources', Exec) {
    workingDir = file('java/res-bundle')
    environment 'PYTHONUTF8', '1'
    commandLine = [
            System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3",
            "download-bundles.py",
            file('java/res-bundle').absolutePath
    ]
}

tasks.register('updateContributors') {
    def script = file('tools/contributors.py')
    def outputFile = file('java/src/org/futo/inputmethod/latin/uix/settings/pages/credits/Contributors.kt')

    inputs.file script
    outputs.file outputFile

    doLast {
        exec {
            environment 'GITHUB_TOKEN', System.getenv('GITHUB_TOKEN') ?: ''
            commandLine 'python3', script.absolutePath
        }
    }
}

preBuild.dependsOn updateLocales

def plutoTuningDir() {
    if (!project.hasProperty('plutoTuning')) return 'java/tuning-stub'
    if (!file('java/tuning-private').exists()) throw new GradleException("-PplutoTuning needs java/tuning-private")
    logger.lifecycle("Pluto: building WITH the private tuning tools (never publish this build)")
    return 'java/tuning-private'
}

android {
    namespace 'org.futo.inputmethod.latin'

    compileSdk 35

    // Required if using classes in android.test.runner
    useLibrary 'android.test.runner'

    // Required if using classes in android.test.base
    useLibrary 'android.test.base'

    // Required if using classes in android.test.mock
    useLibrary 'android.test.mock'

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionName getVersionName()
        versionCode getVersionCode()

        applicationId 'io.github.colincpittman.plutokeyboard'
        testApplicationId 'org.futo.inputmethod.latin.tests'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = false

        // Fork: package only arm64 native code by default (ONNX Runtime alone adds ~55 MB per
        // extra ABI). Build with -PallAbis to include every ABI, e.g. for an x86_64 emulator.
        if (!project.hasProperty('allAbis')) {
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    bundle {
        language {
            enableSplit = true
        }
    }

    signingConfigs {
        debug {
            storeFile file("java/shared.keystore")
        }
    }

    final def keystorePropertiesFile = rootProject.file("keystore.properties")
    def releaseSigning = signingConfigs.debug
    if (keystorePropertiesFile.exists()) {
        final def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
        releaseSigning = signingConfigs.create("release") {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile rootProject.file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    } else {
        project.logger.lifecycle('keystore.properties not found, APK may not be signed')
    }


    final def crashReportPropertiesFile = rootProject.file("crashreporting.properties")
    final def crashReportProperties = new Properties()
    if (crashReportPropertiesFile.exists()) {
        crashReportProperties.load(new FileInputStream(crashReportPropertiesFile))
    } else {
        project.logger.lifecycle('crashreporting.properties not found, crash reporting will be disabled')
    }


    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigning
        }

        buildTypes.each {
            if (crashReportPropertiesFile.exists()) {
                it.buildConfigField "boolean", "ENABLE_ACRA", crashReportProperties['acraEnabled']
                it.buildConfigField "String", "ACRA_URL", crashReportProperties['acraUrl']
                it.buildConfigField "String", "ACRA_USER", crashReportProperties['acraUser']
                it.buildConfigField "String", "ACRA_PASSWORD", crashReportProperties['acraPassword']
            } else {
                it.buildConfigField "boolean", "ENABLE_ACRA", "false"
                it.buildConfigField "String", "ACRA_URL", "\"\""
                it.buildConfigField "String", "ACRA_USER", "\"\""
                it.buildConfigField "String", "ACRA_PASSWORD", "\"\""
            }

            //it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay.futo.org/api/PaymentPortal?product=voiceinput&success=futo-keyboard%3a%2f%2flicense%2factivate\""
            it.buildConfigField "String", "FUTOPAY_URL", "\"https://pay2.futo.org/checkout/polar/futo-keyboard/futo-keyboard-voiceinput/checkout-ready?success=redirect-to-organization-page\""
            it.buildConfigField "String", "FUTOPAY_PRICE", "\"~\$6.99\""

            it.buildConfigField "String", "GOOGLEPAY_URL", "\"https://play.google.com/store/apps/details?id=org.futo.keyboardpayment\""
            it.buildConfigField "String", "GOOGLEPAY_PRICE", "\"~\$11.99\""
        }
    }

    flavorDimensions = ["buildType"]

    productFlavors {
        unstable {
            dimension "buildType"
            applicationIdSuffix ".unstable"
            versionNameSuffix "-unstable"

            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            buildConfigField "boolean", "UPDATE_CHECKING", "false" // Fork: FUTO's update checks and notices point to the official app
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""
            getIsDefault().set(true)

            buildConfigField "String", "PAYMENT_PRICE", "FUTOPAY_PRICE"
        }

        stable {
            dimension "buildType"
            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "false"
            buildConfigField "boolean", "UPDATE_CHECKING", "false" // Fork: FUTO's update checks and notices point to the official app
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""

            buildConfigField "String", "PAYMENT_PRICE", "FUTOPAY_PRICE"
        }

        playstore {
            dimension "buildType"
            applicationIdSuffix ".playstore"
            versionNameSuffix "-playstore"

            buildConfigField "boolean", "IS_PLAYSTORE_BUILD", "true"
            buildConfigField "boolean", "UPDATE_CHECKING", "false"
            buildConfigField "boolean", "UPDATE_CHECKING_NETWORK", "false"
            buildConfigField "String", "BRANCH", "\"${getBranch()}\""

            buildConfigField "String", "PAYMENT_PRICE", "GOOGLEPAY_PRICE"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            res.srcDirs = [
                    'java/res',
                    translationsWithoutEngValues('translations/core'),
                    translationsWithoutEngValues('translations/core-ign'),
                    'java/res-large'
            ]
            // Pluto: the developer's private tuning tools (java/tuning-private, git-ignored) are only
            // built with -PplutoTuning; every other build, releases included, gets the no-op stubs
            java.srcDirs = ['common/src', 'java/src', plutoTuningDir()]
            manifest.srcFile 'java/AndroidManifest.xml'
            assets.srcDirs = ['java/assets']
        }

        playstore {
            java.srcDirs = ['common/src', 'java/src', 'java/playstore/java']
            res.srcDirs = ['java/res-bundle']
            manifest.srcFile 'java/playstore/AndroidManifest.xml'
        }

        stable {
            java.srcDirs = ['common/src', 'java/src', 'java/stable/java']
            manifest.srcFile 'java/stable/AndroidManifest.xml'
        }

        unstable {
            java.srcDirs = ['common/src', 'java/src', 'java/stable/java']
            manifest.srcFile 'java/stable/AndroidManifest.xml'
            res.srcDirs = ['java/unstable/res', translationsWithoutEngValues('translations/devbuild')]
        }

        test {
            // Plain JVM unit tests (no Android dependencies)
            java.srcDirs = ['tests/unit']
        }

        androidTest {
            res.srcDirs = ['tests/res']
            java.srcDirs = ['tests/src']
            manifest.srcFile 'tests/AndroidManifest.xml'
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    aaptOptions {
        noCompress 'dict'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    ndkVersion '28.2.13676358'
    externalNativeBuild {
        cmake {
            path 'native/jni/CMakeLists.txt'
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        viewBinding true
        mlModelBinding true
        buildConfig true
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

